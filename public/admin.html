<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Examio — Admin</title>
<style>
:root{--navy:#0f1f33;--deep:#14263d;--teal:#5fc4b8;--cream:#f6f4ef;--ink:#26364b;--muted:#718092}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.admin-shell{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.admin-side{background:var(--navy);color:#fff;padding:26px 18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;font-size:1.25rem;font-weight:800;margin-bottom:46px}.brand img{width:34px;height:34px;border-radius:50%;background:#0d1724}.side-nav{display:grid;gap:7px}.side-nav button{border:0;background:transparent;color:#c3d0dc;text-align:left;padding:12px;border-radius:9px}.side-nav button.active,.side-nav button:hover{background:rgba(95,196,184,.14);color:#fff}.logout{margin-top:auto;border:1px solid rgba(255,255,255,.2);background:transparent;color:#c3d0dc;padding:11px;border-radius:8px}.admin-main{min-width:0;padding:38px clamp(22px,5vw,70px)}.admin-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;border-bottom:1px solid #dfe3e4;padding-bottom:24px;margin-bottom:26px}.admin-head h1{margin:0 0 6px;font-size:clamp(1.7rem,3vw,2.7rem);letter-spacing:-.04em}.admin-head p{margin:0;color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:7px;color:#247f77;background:rgba(95,196,184,.12);border:1px solid rgba(95,196,184,.3);padding:7px 10px;border-radius:99px;font-size:.8rem;font-weight:700}.badge svg{width:16px;height:16px}.panel{background:#fff;border:1px solid #e1e5e7;border-radius:14px;padding:22px;box-shadow:0 10px 25px rgba(23,37,54,.05);margin-bottom:18px}.panel h2{margin:0 0 16px;font-size:1.05rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:grid;gap:7px}.field label{font-size:.8rem;font-weight:750;color:#516274}.field input,.field textarea,.field select{width:100%;border:1px solid #d7dfe2;border-radius:8px;padding:11px;background:#fbfcfc;color:var(--ink)}.field textarea{min-height:110px;resize:vertical}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.primary,.secondary,.danger{border:0;border-radius:8px;padding:10px 14px;font-weight:750}.primary{background:var(--navy);color:#fff}.secondary{background:#edf4f3;color:#247f77}.danger{background:#fff0ee;color:#a43d32}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #e7ebec;font-size:.84rem}th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.status{font-size:.75rem;border-radius:99px;padding:4px 8px;background:#e9f7f3;color:#267d72}.status.off{background:#f0f1f2;color:#78838e}.savebar{position:fixed;bottom:20px;left:calc(245px + 50%);transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:12px;padding:10px 12px 10px 18px;display:none;align-items:center;gap:14px;box-shadow:0 12px 35px rgba(15,31,51,.3);z-index:5}.savebar.show{display:flex}.savebar button{border:0;border-radius:7px;padding:8px 12px}.savebar .save{background:var(--teal);color:var(--navy);font-weight:800}.toast{position:fixed;right:24px;bottom:24px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:8px;display:none}.toast.show{display:block}.login-wrap{min-height:100vh;display:grid;place-items:center;background:var(--navy);padding:20px}.login-card{width:min(420px,100%);background:#fff;border-radius:16px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.login-card h1{margin:0 0 8px}.login-card p{color:var(--muted);margin:0 0 24px}.login-card .field{margin-bottom:16px}.error{color:#a43d32;font-size:.85rem;min-height:20px}@media(max-width:760px){.admin-shell{grid-template-columns:1fr}.admin-side{padding:16px;position:sticky;top:0;z-index:4}.brand{margin-bottom:14px}.side-nav{display:flex;overflow:auto}.side-nav button{white-space:nowrap}.logout{position:absolute;right:16px;top:16px}.admin-main{padding:25px 16px 100px}.grid{grid-template-columns:1fr}.savebar{left:50%;width:calc(100% - 28px);justify-content:space-between}}
</style>
</head>
<body><div id="app"></div><div id="toast" class="toast"></div>
<script>
(()=>{const app=document.getElementById('app');let csrf='',current='profile',dirty=false,state={};
const badge=`<span class="badge" title="Admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6l-7-3Z"/><path d="m8 11 2.5 2.5L16 8"/></svg>Admin</span>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,options={}){const res=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.body?{'X-CSRF-Token':csrf}:{}),...(options.headers||{})},...options});const data=await res.json().catch(()=>({}));if(res.status===401){showLogin();throw new Error('Unauthorized')}if(!res.ok)throw new Error(data.error||'Något gick fel');return data}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
function showLogin(message=''){app.innerHTML=`<main class="login-wrap"><form class="login-card" id="login"><div class="brand"><img src="/assets/examio-logo.png" alt="Examio"><span>examio</span></div><h1>Admin</h1><p>Logga in för att hantera Examio.</p><div class="field"><label for="password">Lösenord</label><input id="password" type="password" autocomplete="current-password" required></div><div class="error">${esc(message)}</div><button class="primary" type="submit">Logga in</button></form></main>`;document.getElementById('login').onsubmit=async e=>{e.preventDefault();try{const data=await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:document.getElementById('password').value})});csrf=data.csrf;await load()}catch(err){showLogin(err.message)}}}
async function load(){const session=await api('/api/admin/session');if(!session.authenticated)return showLogin();csrf=session.csrf;state.profile=await api('/api/admin/profile');state.settings=await api('/api/admin/settings');state.keys=await api('/api/admin/keys');state.exams=await api('/api/admin/exams');state.visits=await api('/api/admin/visits');dirty=false;render()}
function render(){app.innerHTML=`<div class="admin-shell"><aside class="admin-side"><div class="brand"><img src="/assets/examio-logo.png" alt="Examio"><span>examio</span></div><nav class="side-nav"><button class="${current==='profile'?'active':''}" data-tab="profile">Profil</button><button class="${current==='keys'?'active':''}" data-tab="keys">Provnycklar</button><button class="${current==='visits'?'active':''}" data-tab="visits">Besökare (IP)</button><button class="${current==='settings'?'active':''}" data-tab="settings">Inställningar</button></nav><button class="logout" id="logout">Logga ut</button></aside><main class="admin-main"><header class="admin-head"><div><h1>${current==='profile'?'Adminprofil':current==='keys'?'Provnycklar':current==='visits'?'Besökare':'Inställningar'}</h1><p>Håll ordning på Examio utan att ändra elevflödet.</p></div>${badge}</header><section id="view"></section></main><div class="savebar ${dirty?'show':''}"><span>Du har osparade ändringar</span><button class="secondary" id="ignore">Ignorera</button><button class="save" id="save">Spara ändringar</button></div></div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(dirty&&!confirm('Ignorera osparade ändringar?'))return;dirty=false;current=b.dataset.tab;render()});document.getElementById('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST',body:'{}'});showLogin()};drawView()}
function drawView(){const v=document.getElementById('view');if(current==='profile')v.innerHTML=`<div class="panel"><h2>Din profil</h2><div class="grid"><div class="field"><label>Visningsnamn</label><input data-edit="name" value="${esc(state.profile.name)}"></div><div class="field"><label>Titel</label><input data-edit="title" value="${esc(state.profile.title)}"></div></div></div>`;if(current==='settings')v.innerHTML=`<div class="panel"><h2>Inställningar</h2><div class="field"><label>Integritetsnotis</label><textarea data-edit="privacy">${esc(state.settings.privacy||'Besök på webbplatsen loggas i 30 dagar för säkerhet och felsökning.')}</textarea></div></div>`;if(current==='keys')v.innerHTML=`<div class="panel"><h2>Skapa provnyckel</h2><div class="grid"><div class="field"><label>Namn</label><input id="new-name" placeholder="fysik-mekanik"></div><div class="field"><label>Går ut (valfritt)</label><input id="new-expiry" type="date"></div></div><br><button class="primary" id="create-key">Skapa provnyckel</button></div><div class="panel"><h2>Publicerade nycklar</h2><div class="table-wrap"><table><thead><tr><th>Namn</th><th>Nyckel</th><th>Status</th><th>Åtgärd</th></tr></thead><tbody>${state.keys.map(k=>`<tr><td>${esc(k.name)}</td><td><code>${esc(k.key)}</code> <button class="secondary" data-copy="${esc(k.key)}">Kopiera</button></td><td><span class="status ${k.status!=='active'?'off':''}">${esc(k.status)}</span></td><td class="row"><button class="secondary" data-rename="${esc(k.id)}">Byt namn</button><button class="secondary" data-toggle="${esc(k.id)}">${k.status==='active'?'Oaktivera':'Aktivera'}</button><a class="secondary" href="/?key=${encodeURIComponent(k.key)}" target="_blank">Testa prov</a><button class="danger" data-delete="${esc(k.id)}">Ta bort</button></td></tr>`).join('')||'<tr><td colspan="4">Inga egna nycklar ännu.</td></tr>'}</tbody></table></div></div><div class="panel"><h2>Provredigerare</h2><p>Skapa ett prov och redigera frågor med samma serverlagrade sparflöde.</p><button class="primary" id="create-exam">Nytt prov</button>${state.exams.map(e=>`<div class="panel"><div class="row"><strong>${esc(e.title)}</strong><button class="secondary" data-edit-exam="${esc(e.id)}">Redigera prov</button></div></div>`).join('')}</div>`;if(current==='visits')v.innerHTML=`<div class="panel"><h2>Senaste besök</h2><div class="table-wrap"><table><thead><tr><th>IP</th><th>Tid</th><th>Sida</th><th>Besök</th><th></th></tr></thead><tbody>${state.visits.visits.map(x=>`<tr><td>${esc(x.ip)}</td><td>${esc(x.ts)}</td><td>${esc(x.page)}</td><td>${state.visits.counts[x.ip]||1}</td><td><button class="danger" data-block="${esc(x.ip)}">Blockera</button></td></tr>`).join('')||'<tr><td colspan="5">Inga besök loggade ännu.</td></tr>'}</tbody></table></div></div><div class="panel"><h2>Blockerade adresser</h2>${state.visits.blocked.map(x=>`<div class="row"><code>${esc(x.ip)}</code><span>${esc(x.reason)}</span><button class="secondary" data-unblock="${esc(x.ip)}">Avblockera</button></div>`).join('')||'Inga blockerade adresser.'}</div>`;bindView()}
function bindView(){document.querySelectorAll('[data-edit]').forEach(x=>x.oninput=()=>{state[current][x.dataset.edit]=x.value;dirty=true;renderSaveOnly()});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.copy);toast('Nyckel kopierad')});document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=async()=>{const k=state.keys.find(x=>x.id===b.dataset.rename);const name=prompt('Nytt namn:',k?.name||'');if(name){await api('/api/admin/keys/'+b.dataset.rename,{method:'PUT',body:JSON.stringify({name})});load()}});document.getElementById('save')?.addEventListener('click',saveChanges);document.getElementById('ignore')?.addEventListener('click',()=>{dirty=false;load()});document.getElementById('create-key')?.addEventListener('click',async()=>{await api('/api/admin/keys',{method:'POST',body:JSON.stringify({name:document.getElementById('new-name').value,expiry:document.getElementById('new-expiry').value})});toast('Provnyckel skapad');load()});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const k=state.keys.find(x=>x.id===b.dataset.toggle);await api('/api/admin/keys/'+k.id,{method:'PUT',body:JSON.stringify({status:k.status==='active'?'inactive':'active'})});load()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('Ta bort provnyckeln?')){await api('/api/admin/keys/'+b.dataset.delete,{method:'DELETE',body:JSON.stringify({_delete:true})});load()}});document.getElementById('create-exam')?.addEventListener('click',async()=>{await api('/api/admin/exams',{method:'POST',body:JSON.stringify({title:'Nytt prov',description:'',questions:[]})});toast('Prov skapat');load()});document.querySelectorAll('[data-edit-exam]').forEach(b=>b.onclick=()=>openExamEditor(b.dataset.editExam));document.querySelectorAll('[data-block]').forEach(b=>b.onclick=async()=>{const reason=prompt('Orsak (valfritt):','');if(reason!==null){await api('/api/admin/visits/block',{method:'POST',body:JSON.stringify({ip:b.dataset.block,reason})});load()}});document.querySelectorAll('[data-unblock]').forEach(b=>b.onclick=async()=>{await api('/api/admin/visits/unblock',{method:'POST',body:JSON.stringify({ip:b.dataset.unblock})});load()})}
function openExamEditor(id){const exam=state.exams.find(x=>x.id===id);if(!exam)return;const v=document.getElementById('view');v.innerHTML=`<div class="panel"><h2>Redigera prov</h2><div class="grid"><div class="field"><label>Provets titel</label><input id="exam-title" value="${esc(exam.title)}"></div><div class="field"><label>Beskrivning</label><input id="exam-description" value="${esc(exam.description)}"></div></div></div><div class="panel"><h2>Frågor</h2><p>En fråga per rad i JSON-format. Typ: mcq eller skrivfråga, med text, alternativ, rätta svar och poäng.</p><div class="field"><textarea id="exam-questions" style="min-height:260px">${esc(JSON.stringify(exam.questions||[],null,2))}</textarea></div><br><button class="primary" id="save-exam">Spara prov</button> <button class="secondary" id="cancel-exam">Avbryt</button></div>`;document.getElementById('cancel-exam').onclick=()=>render();document.getElementById('save-exam').onclick=async()=>{let questions=[];try{questions=JSON.parse(document.getElementById('exam-questions').value||'[]');if(!Array.isArray(questions))throw Error()}catch{toast('Frågorna måste vara giltig JSON');return}await api('/api/admin/exams/'+id,{method:'PUT',body:JSON.stringify({title:document.getElementById('exam-title').value,description:document.getElementById('exam-description').value,questions})});toast('Prov sparat');load()}}
async function saveChanges(){if(current==='profile')await api('/api/admin/profile',{method:'PUT',body:JSON.stringify(state.profile)});if(current==='settings')await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(state.settings)});dirty=false;toast('Ändringar sparade');render()}
function renderSaveOnly(){document.querySelector('.savebar')?.classList.add('show')}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});load().catch(()=>showLogin())})()
</script></body></html>
