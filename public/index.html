  const studyGuideRaw="Guiden till Elektromagnetism (Åk 8)\nMålet med detta dokument är att du ska förstå, kunna förklara och se samband för att nå ett högre bedömning\n1. Magneter och magnetfält (Grunderna)\nFör att förstå resten av kapitlet måste vi förstå vanliga magneter.\n•\tPoler och krafter: En magnet har alltid två poler, en nordpol (N) och en sydpol (S).\no\tAttraherar: Olika poler dras till varandra (Nord dras till Syd).\no\tRepellerar: Lika poler stöter bort varandra (Nord stöter bort Nord, Syd stöter bort Syd).\n•\tMagnetfält: Runt en magnet finns ett osynligt kraftfält. Vi ritar detta med fältlinjer. Fältlinjerna går alltid från nordpolen till sydpolen. Ju tätare linjerna är, desto starkare är magnetfältet (starkast vid polerna).\n•\tJordens magnetfält: Jorden är som en gigantisk magnet. Detta magnetfält är livsviktigt! Det fungerar som en osynlig sköld som skyddar jorden och oss från solvindar (farliga laddade partiklar från solen). A-nivå-fakta: När solvindarna krockar med magnetfältet vid våra poler bildas norrsken (Aurora Borealis).\n2. Elektromagnetism (När magi blir vetenskap)\nDet viktigaste sambandet i fysiken!\n•\tElektricitet skapar magnetfält: Om du skickar ström genom en sladd bildas ett osynligt magnetfält runt sladden.\n•\tMagnetfält skapar elektricitet: Om du rör en magnet nära en sladd, tvingas elektronerna i sladden att röra på sig, och elektricitet skapas. Detta kallas för induktion (mer om det strax!).\n3. Elektromagneten (Magneten du kan styra)\nEn vanlig stavmagnet är alltid magnetisk. En elektromagnet är en smartare magnet som du kan sätta på och stänga av.\n•\tHur fungerar den? Du behöver tre saker:\n1.\tEn spole (en koppartråd som snurrats många varv).\n2.\tEn järnkärna (t.ex. en järnspik som spolen snurras runt).\n3.\tStröm (t.ex. från ett batteri).\nNär strömmen åker genom spolen blir järnkärnan kraftigt magnetisk. När du stänger av strömmen försvinner magnetismen!\n•\tHur gör man den starkare? (Viktig provfråga!)\n1.\tLinda fler varv med tråd på spolen.\n2.\tÖka strömstyrkan (starkare batteri).\n3.\tHa en tjockare/bättre järnkärna.\n•\tAnvändningsområden:\no\tBranddörrar på skolan: En elektromagnet håller dörrarna öppna. Om brandlarmet går bryts strömmen, magnetismen försvinner och dörrarna stängs automatiskt för att stoppa elden.\no\tSkrotlyftar: Kan lyfta en bil och sedan \"släppa\" den genom att stänga av strömmen.\no\tHögtalare: Använder elektromagneter för att skapa ljudvågor.\n4. Induktion & Generatorn (Att tillverka ström)\nDetta är anledningen till att vi har el i våra hem idag!\n•\tVad är induktion? Induktion är fenomenet att skapa elektricitet med hjälp av magnetism. När ett magnetfält förändras (t.ex. när en magnet rör sig ut och in i en spole) tvingas elektroner i rörelse, och en elektrisk ström \"induceras\" (skapas).\n•\tGeneratorn: En maskin som utnyttjar induktion.\no\tHur den fungerar: Inuti generatorn finns spolar och magneter. När magneten snurrar inuti spolen skapas ström.\no\tEnergiomvandling: Den omvandlar rörelseenergi till elektrisk energi.\no\tAnvändning: I vindkraftverk (vinden snurrar magneten), och vattenkraftverk (forsande vatten snurrar magneten). Hela vårt samhälle drivs av stora generatorer!\n5. Elmotorn (Från el till rörelse)\nMotorn är exakt samma maskin som generatorn, fast tvärtom!\n•\tHur fungerar den? Du skickar in ström i en spole som sitter mellan två magneter. Strömmen gör spolen magnetisk (den blir en elektromagnet). Eftersom lika poler repellerar (stöter bort varandra), kommer spolen att börja snurra för att komma undan magneterna runt omkring.\n•\tEnergiomvandling: Den omvandlar elektrisk energi till rörelseenergi.\n•\tAnvändning: Elvispar, elbilar, fläktar, tvättmaskiner.\n6. Transformatorn (Spännings-ändraren)\n•\tVad gör den? Den förändrar (transformerar) spänningen. Den kan höja eller sänka Volt-talet.\n•\tAnvändning i vardagen: En mobilladdare. I vägguttaget hemma är det 230 Volt (livsfarligt för en liten mobil). Mobilladdaren är en liten transformator som sänker (transformerar ner) spänningen till ca 5 Volt, så att mobilen kan laddas säkert.\n\n Magnet & Poler: Har nordpol och sydpol. Lika poler repellerar (stöter ifrån), olika poler attraherar (drar till sig). \n•\tMagnetfält & Fältlinjer: Det osynliga området runt en magnet där krafter verkar. Fältlinjer visar fältets riktning. \n•\t  Jordens magnetfält: Jordens eget magnetfält som skyddar mot solvindar och laddade partiklar. \n•\t  Missvisning: Vinkelavvikelsen mellan geografisk nord och magnetisk nord. \n•\tInfluens: När magnetism \"smittar\" till ett järnföremål utan beröring. \n•\t  Elektromagnet: En magnet skapad av elektrisk ström i en spole runt en järnkärna. Kan stängas av och på. \n•\t Elektromagnetens styrka: Ökas med fler varv på spolen, starkare ström eller en järnkärna. \n•\tInduktion: När en elektrisk ström skapas genom att ett magnetfält rör sig i en spole. \n•\t Elmotor: Omvandlar elektrisk energi till rörelseenergi (t.ex. elvisp). \n•\t  Generator: Omvandlar rörelseenergi till elektrisk energi via induktion (t.ex. i vattenkraft och vindkraft). \n•\t  Transformator: Höjer eller sänker en växelspänning (t.ex. i en mobilladdare). \n•\t  Primär- & Sekundärspole: Primärspolen kopplas till strömkällan, sekundärspolen ger ut den omvandlade spänningen. \n•\t  Växelström: Ström som byter riktning hela tiden (50 Hz i vägguttaget).\n•\t\nA-NIVÅ: Analys och Samband (Visa läraren detta!)\nFör att få A måste du visa att du förstår skillnaden och likheten mellan en Elmotor och en Generator. Lär dig detta utantill:\n\"En elmotor och en generator är i grunden samma sak, men de gör motsatta energiomvandlingar. Generatorn tar in rörelseenergi (t.ex. vind) och gör om det till elektricitet genom induktion. Elmotorn gör tvärtom: den tar in elektricitet och gör om det till rörelseenergi (t.ex. för att snurra en elvisp).\"\n Test dig själv (Aktiv påminnelse)\nTäck över texten ovan och försök svara på dessa frågor högt. Om du kan dem, är du redo för provet!\n1.\tVad är skillnaden på att attrahera och repellera?\n2.\tNämn tre saker som gör en elektromagnet starkare.\n3.\tVarför stängs branddörrarna på skolan när larmet går (utifrån fysikens lagar)?\n4.\tVad är induktion?\n5.\tFörklara hur en generator och en elmotor är varandras motsatser (Vilka energiomvandlingar sker?).\n6.\tVarför behöver du en transformator till din mobiltelefon?";

  function assistantReply(query){
    const text=(query||'').trim();

    const mcqs=rows.filter(x=>x.q.type==='mcq');
    const written=rows.find(x=>x.q.type==='written');

    const weakWritten=written&&written.score<2;
    const sources={physics:'<a href="https://www.skolverket.se/download/18.1cf74b4f183ff5ed375d78/1668518046135/pdf9865.pdf" target="_blank" rel="noreferrer">Skolverkets kommentarmaterial i fysik</a>',grade:'<a href="https://www.skolverket.se/prov-och-bedomning/betyg/betygsskalan" target="_blank" rel="noreferrer">Skolverkets betygsskala</a>',feedback:'<a href="https://www.skolverket.se/prov-och-bedomning/bedomning/bedomning-i-formativt-syfte" target="_blank" rel="noreferrer">Skolverkets formativa bedömning</a>'};
    const seen=(state.assistantMessages||[]).filter(m=>m.from==='assistant').map(m=>m.text);
    const choose=(items)=>items.find(x=>!seen.includes(x))||items[(seen.length)%items.length];
    const listTitles=(items,limit=4)=>items.slice(0,limit).map(x=>`<b>${esc(x.q.title)}</b>`).join(', ');
    const selected=(x)=>x.answer!==''&&x.q.options?esc(x.q.options[Number(x.answer)]??x.answer):'Ej besvarad';
    const correct=(x)=>x.q.options?esc(x.q.options[Number(x.q.correct)]):'';
    const writtenAnswer=written?.answer?esc(written.answer):'Du skrev inget svar på skrivfrågan.';

    if(!text)return 'Skriv en fråga så går jag igenom just dina svar, inte ett generellt exempel.';

    }
    if(q.includes('mitt svar')||q.includes('vad valde')||q.includes('mina svar')){
      const answered=rows.filter(x=>x.answer!=='');

      const first=answered[0];

  }
